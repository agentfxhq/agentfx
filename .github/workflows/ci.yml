name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: MCP server e2e
        run: python3 tools/mcp-e2e.py

  # macOS runners are scarce and slow: run this by hand (Actions > CI > Run workflow).
  macos:
    name: macOS build and CPU test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: CPU test
        env:
          AGENTFX_GPU: "0"
        run: cargo test --release --locked

  # Windows is untested on real hardware and its runners are slow: run this by hand
  # (Actions > CI > Run workflow). CPU only; encode tests skip themselves without ffmpeg.
  windows:
    name: Windows build and CPU test (experimental)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: CPU test
        env:
          AGENTFX_GPU: "0"
        run: cargo test --release --locked --no-fail-fast
