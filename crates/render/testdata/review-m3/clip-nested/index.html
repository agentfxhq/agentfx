<!doctype html><html><head><meta charset="utf-8"><meta name="reel-duration" content="1"><meta name="reel-fps" content="30">
<style>
body{margin:0;background:#fff}
.card{position:absolute;left:100px;top:100px;width:400px;height:300px;overflow:hidden;border-radius:24px;background:#eee;animation:slide 1s linear both}
.img{width:400px;height:300px;background:linear-gradient(90deg,#f00,#00f);animation:zoom 1s linear both}
@keyframes slide{from{translate:0px 0px}to{translate:300px 0px}}
@keyframes zoom{from{scale:1}to{scale:2}}
</style></head><body><div class="card"><div class="img"></div></div></body></html>
