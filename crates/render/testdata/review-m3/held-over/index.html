<!doctype html><html><head><meta charset="utf-8"><meta name="reel-duration" content="1"><meta name="reel-fps" content="30">
<style>
body{margin:0;background:#fff}
.b{position:absolute;left:100px;top:100px;width:200px;height:200px;background:#00f;animation:a 1s linear both, b 1s step-end both}
@keyframes a{from{transform:translateX(0px)}to{transform:translateX(400px)}}
@keyframes b{from{transform:translateX(0%)}to{transform:translateX(100%)}}
</style></head><body><div class="b"></div></body></html>
