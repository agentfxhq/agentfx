<!doctype html><html><head><meta charset="utf-8"><meta name="reel-duration" content="1"><meta name="reel-fps" content="30">
<style>
body{margin:0;background:#fff}
.sp{height:100px;animation:g 1s step-end both}
@keyframes g{from{height:100px}50%{height:400px}to{height:400px}}
.r{margin-left:200px;width:200px;height:100px;background:#0a0;animation:r 1s linear both}
@keyframes r{from{rotate:0deg}to{rotate:90deg}}
</style></head><body><div class="sp"></div><div class="r"></div></body></html>
