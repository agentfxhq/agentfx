html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--body); position: relative; }
.abs { position: absolute; left: 0; top: 0; }

.box { position: absolute; left: 134px; top: 340px; width: 560px; box-sizing: border-box; border: 2px solid var(--border); }
.box .cell { padding: 18px 24px; border-bottom: 1.5px solid var(--faint); }
.box .cell:last-child { border-bottom: 0; }
.box .k { font-size: 26px; color: var(--muted); }
.box .big { font-family: var(--display); font-size: 140px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.0; font-variant-numeric: tabular-nums; margin-top: 6px; }
.box .v { margin-top: 4px; font-size: 34px; }
.tick { position: absolute; width: 90px; text-align: right; font-family: var(--mono); font-size: 26px; color: var(--muted); }
.val { position: absolute; width: 160px; text-align: center; font-family: var(--mono); font-size: 32px; }
.q { position: absolute; top: 940px; width: 160px; text-align: center; font-family: var(--mono); font-size: 30px; color: var(--muted); letter-spacing: 0.12em; }
.ann { position: absolute; left: 1150px; top: 450px; width: 400px; text-align: right; font-size: 28px; color: var(--accent); }
