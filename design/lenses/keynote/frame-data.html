<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keynote: Data</title>
<style>
:root {
  --bg: #0b0b0c; --bg2: #161618; --surface: #1c1c1e; --surface2: #2c2c2e;
  --text: #f5f5f7; --muted: #a1a1a6; --faint: #86868b; --accent: #2997ff; --accent2: #48484a;
  --display: "Inter"; --body: "Inter"; --mono: "JetBrains Mono";
  --r-sm: 14px;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: radial-gradient(circle at 50% 35%, #1d1d20 0%, #0b0b0c 70%); color: var(--text); font-family: var(--body); position: relative; }
.title { position: absolute; left: 134px; top: 96px; width: 1652px; text-align: center; font-family: var(--display); font-size: 72px; font-weight: 600; letter-spacing: -0.03em; }
.title span { color: var(--muted); }
.stat { position: absolute; left: 134px; top: 400px; width: 760px; }
.stat .big { font-family: var(--display); font-size: 230px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9; font-variant-numeric: tabular-nums; }
.stat .unit { margin-top: 26px; font-size: 52px; font-weight: 500; color: var(--muted); letter-spacing: -0.02em; }
.chart { position: absolute; left: 1006px; top: 300px; width: 780px; height: 680px; }
.bar { position: absolute; bottom: 72px; width: 150px; border-radius: var(--r-sm) var(--r-sm) 0 0; background: var(--accent2); }
.bar.hi { background: var(--accent); }
.v { position: absolute; width: 150px; text-align: center; font-size: 40px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.v.hi { color: var(--text); font-size: 48px; font-weight: 700; }
.q { position: absolute; bottom: 0; width: 150px; text-align: center; font-size: 32px; color: var(--muted); }
.note { position: absolute; left: 380px; top: 0; width: 400px; text-align: right; font-size: 36px; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<div class="title">Revenue 2025 <span>in thousands of euros</span></div>

<div class="stat">
  <div class="big">12,480</div>
  <div class="unit">Orders</div>
</div>

<!-- 168 = 470 px, bars on a 210 px pitch, no axis -->
<div class="chart">
  <div class="note">×2 since Q1</div>
  <div class="bar" style="left: 0; height: 235px;"></div>
  <div class="bar" style="left: 210px; height: 271px;"></div>
  <div class="bar" style="left: 420px; height: 338px;"></div>
  <div class="bar hi" style="left: 630px; height: 470px;"></div>
  <div class="v" style="left: 0; top: 320px;">84</div>
  <div class="v" style="left: 210px; top: 284px;">97</div>
  <div class="v" style="left: 420px; top: 217px;">121</div>
  <div class="v hi" style="left: 630px; top: 74px;">168</div>
  <div class="q" style="left: 0;">Q1</div>
  <div class="q" style="left: 210px;">Q2</div>
  <div class="q" style="left: 420px;">Q3</div>
  <div class="q" style="left: 630px; color: #f5f5f7;">Q4</div>
</div>
</body>
</html>
