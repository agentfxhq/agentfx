<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keynote: Diagram</title>
<style>
:root {
  --bg: #0b0b0c; --bg2: #161618; --surface: #1c1c1e; --surface2: #2c2c2e; --border: #3a3a3c;
  --text: #f5f5f7; --muted: #a1a1a6; --faint: #86868b; --accent: #2997ff; --accent2: #48484a;
  --display: "Inter"; --body: "Inter"; --mono: "JetBrains Mono";
  --r: 28px; --r-sm: 14px;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: radial-gradient(circle at 50% 35%, #1d1d20 0%, #0b0b0c 70%); color: var(--text); font-family: var(--body); position: relative; }
.head { position: absolute; left: 134px; top: 84px; width: 1652px; text-align: center; }
.head .step { font-size: 32px; font-weight: 500; color: var(--muted); }
.head h1 { margin: 16px 0 0 0; font-family: var(--display); font-size: 96px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; }
.row { position: absolute; left: 134px; top: 346px; width: 1652px; display: flex; gap: 40px; }
.tile { position: relative; width: 242px; height: 228px; box-sizing: border-box; border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.tile svg.ic { width: 60px; height: 60px; }
.tile .l { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; color: var(--muted); }
.tile .ok { position: absolute; right: 18px; top: 18px; width: 36px; height: 36px; }
.tile.active { background: var(--surface2); border: 4px solid var(--accent); }
.tile.active .l { color: var(--text); }
.tile.next { background: var(--bg2); }
.tile.next .l { color: var(--faint); }
.chev { position: absolute; right: -34px; top: 98px; width: 28px; height: 32px; }
.track { position: absolute; left: 134px; top: 614px; width: 1652px; height: 8px; border-radius: 4px; background: var(--surface2); }
.fill { position: absolute; left: 0; top: 0; width: 967px; height: 8px; border-radius: 4px; background: var(--text); }
.fill .dot { position: absolute; right: -10px; top: -8px; width: 24px; height: 24px; border-radius: 12px; background: var(--accent); }
.count { position: absolute; left: 134px; top: 640px; width: 1652px; display: flex; justify-content: space-between; font-size: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel { position: absolute; left: 434px; top: 724px; width: 1052px; height: 272px; box-sizing: border-box; border-radius: var(--r); background: var(--surface); padding: 34px 48px; }
.panel .t { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; text-align: center; }
.panel .t span { color: var(--muted); font-weight: 500; }
.jobs { margin-top: 34px; display: flex; justify-content: space-between; }
.job { width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.job .name { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 14px; }
.job .name svg { width: 38px; height: 38px; }
.job .st { font-size: 30px; color: var(--muted); }
.job.run .name { color: var(--accent); }
.job.run .st { color: var(--accent); }
</style>
</head>
<body>
<div class="head">
  <div class="step">Step 4 of 6</div>
  <h1>How a change goes live.</h1>
</div>

<div class="row">
  <div class="tile">
    <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-6 4z"/></svg>
    <span class="l">Chat</span>
    <svg class="chev" viewBox="0 0 28 32" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l10 10-10 10"/></svg>
  </div>
  <div class="tile">
    <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
    <span class="l">Agent</span>
    <svg class="chev" viewBox="0 0 28 32" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l10 10-10 10"/></svg>
  </div>
  <div class="tile">
    <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M2 12h6M16 12h6"/></svg>
    <span class="l">Git Commit</span>
    <svg class="chev" viewBox="0 0 28 32" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l10 10-10 10"/></svg>
  </div>
  <div class="tile active">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#2997ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h4a2 2 0 0 1 2 2v5"/></svg>
    <span class="l">Pipeline</span>
    <svg class="chev" viewBox="0 0 28 32" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l10 10-10 10"/></svg>
  </div>
  <div class="tile next">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>
    <span class="l">Staging</span>
    <svg class="chev" viewBox="0 0 28 32" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l10 10-10 10"/></svg>
  </div>
  <div class="tile next">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    <span class="l">Production</span>
  </div>
</div>

<div class="track"><div class="fill"><div class="dot"></div></div></div>
<div class="count"><span>Chat</span><span>4 of 6</span><span>Production</span></div>

<div class="panel">
  <div class="t">Pipeline <span>#482</span></div>
  <div class="jobs">
    <div class="job">
      <div class="name"><svg viewBox="0 0 24 24" fill="none" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>build</div>
      <div class="st">passed, 1:12</div>
    </div>
    <div class="job">
      <div class="name"><svg viewBox="0 0 24 24" fill="none" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>test</div>
      <div class="st">passed, 0:48</div>
    </div>
    <div class="job run">
      <div class="name"><svg viewBox="0 0 24 24" fill="#2997ff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>deploy</div>
      <div class="st">running</div>
    </div>
  </div>
</div>
</body>
</html>
