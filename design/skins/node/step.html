<!--
skin: node/step   (numbered step card for processes; L3 skin)
slots: n label sub icon
parts: active, done
size: w=360
-->
<style>
.skin-node-step{position:relative;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:{{px:10}};padding:{{px:26}} {{px:28}} {{px:28}};background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);font-family:var(--font-body)}
.skin-node-step.surface-outline{background:transparent}
.skin-node-step .num{font-family:var(--font-display);font-weight:var(--w-display);font-size:{{px:64}};line-height:0.9;color:var(--accent2);letter-spacing:-0.03em}
.skin-node-step .lb{font-family:var(--font-display);font-weight:var(--w-heading);font-size:{{px:38}};line-height:1.1;color:var(--text);white-space:nowrap}
.skin-node-step .sb{font-size:{{px:26}};line-height:1.25;color:var(--muted)}
.skin-node-step .rule{width:{{px:48}};height:{{px:4}};background:var(--accent2);border-radius:{{px:2}}}
.skin-node-step .act{position:absolute;left:0;top:0;right:0;bottom:0;border:{{px:4}} solid var(--mint);border-radius:var(--radius)}
.skin-node-step .done{position:absolute;right:{{px:18}};top:{{px:18}};width:{{px:44}};height:{{px:44}};border-radius:{{px:44}};background:var(--accent2);display:flex;align-items:center;justify-content:center}
.skin-node-step .done svg{width:{{px:26}};height:{{px:26}}}
</style>
<div class="skin-node-step" style="width:100%">
  <div class="num">{{n}}</div>
  <div class="rule"></div>
  <div class="lb">{{label}}</div>
  <div class="sb">{{sub}}</div>
  <div class="act" data-part="active"></div>
  <div class="done" data-part="done">{{icon:check:paper}}</div>
</div>
