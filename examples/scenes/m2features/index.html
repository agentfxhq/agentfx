<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="reel-duration" content="3">
<meta name="reel-fps" content="30">
<meta name="reel-frames" content="90">
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
body { margin: 0; background: #f5f6f8; font: 28px/1.4 "Inter", sans-serif; color: #15181d; }
:root { --w: 200px; }
.stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.card { position: absolute; left: 160px; top: 160px; width: var(--w); height: 220px; background: #fff; border-radius: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 24px; animation: grow 3s linear both, shadow 3s linear both; }
.card::before { content: "Before ✓ "; color: #17845a; font-weight: 700; }
@keyframes grow { 0% { --w: 200px; animation-timing-function: step-end; } 40% { --w: 320px; animation-timing-function: step-end; } 100% { --w: 320px; } }
@keyframes shadow { 0% { box-shadow: 0 4px 12px rgba(0,0,0,.12); } 100% { box-shadow: 0 24px 60px rgba(0,0,0,.35); } }
.over { position: absolute; left: 300px; top: 260px; width: 260px; height: 160px; background: #17845a; color: #fff; border-radius: 12px; z-index: 5;
  padding: 20px; animation: slide 3s both; }
@keyframes slide { 0% { translate: 0px 0px; animation-timing-function: cubic-bezier(.2,.8,.2,1); } 100% { translate: 520px 120px; } }
.under { position: absolute; left: 420px; top: 300px; width: 300px; height: 200px; background: #e5f4ed; z-index: 1; border-radius: 12px; }
.blend { position: absolute; left: 1100px; top: 200px; width: 400px; height: 300px; background: linear-gradient(90deg, #f0a, #0af); }
.blend span { position: absolute; left: 60px; top: 60px; width: 280px; height: 180px; background: #ffcc00; mix-blend-mode: multiply; border-radius: 90px; }
.fx { position: absolute; left: 1150px; top: 620px; width: 320px; height: 160px; background: #fff; border-radius: 20px; filter: blur(1.5px) drop-shadow(0 10px 8px rgba(0,0,0,.4)); padding: 24px; }
.pop { position: absolute; left: 200px; top: 700px; padding: 20px 28px; background: #15181d; color: #fff; border-radius: 12px; animation: vis 3s both, rot 3s both; }
@keyframes vis { 0% { display: none; animation-timing-function: step-end; } 33% { display: block; animation-timing-function: step-end; } 100% { display: block; } }
@keyframes rot { 0% { rotate: -8deg; scale: .8; } 100% { rotate: 6deg; scale: 1.1; } }
</style>
<script src="runtime.js"></script>
</head><body><div class="stage">
<div class="under"></div>
<div class="card">Card with a growing custom-property width and an animated shadow.</div>
<div class="over">z-index 5 over the card</div>
<div class="blend"><span></span></div>
<div class="fx">Filter chain</div>
<div class="pop">Mounted at 1 s, rotate + scale</div>
</div></body></html>
